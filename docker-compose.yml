services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: runproof
      POSTGRES_PASSWORD: runproof
      POSTGRES_DB: runproof
    ports:
      - "5432:5432"
    volumes:
      - runproof_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runproof -d runproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  runproof_postgres_data:
